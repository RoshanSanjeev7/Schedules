<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H2 2026 — Work &amp; School Timeline</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --grid: #232838;
    --grid-strong: #2e3447;
    --work: #4f8cff;
    --work-edge: #2f6fe6;
    --school: #ff8a3d;
    --school-edge: #e06a1f;
    --milestone: #b388ff;
    --milestone-edge: #8e5ce6;
    --today: #ff4d6d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 48px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .nav-btn {
    display: inline-block;
    background: rgba(79,140,255,0.18);
    color: #cfdfff;
    border: 1px solid rgba(79,140,255,0.55);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 8px;
    transition: background 100ms;
  }
  .nav-btn:hover { background: rgba(79,140,255,0.32); }
  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .legend .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .chart-wrap {
    background: var(--panel);
    border: 1px solid #1f2533;
    border-radius: 12px;
    padding: 16px 8px 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  svg { display: block; width: 100%; height: auto; }
  .row-label {
    fill: var(--text);
    font-size: 13px;
    font-weight: 500;
    dominant-baseline: middle;
  }
  .row-sub {
    fill: var(--muted);
    font-size: 11px;
    dominant-baseline: middle;
  }
  .bar { rx: 6; ry: 6; cursor: pointer; }
  .bar-label {
    fill: white;
    font-size: 12px;
    font-weight: 600;
    dominant-baseline: middle;
    pointer-events: none;
  }
  .axis path, .axis line {
    stroke: var(--grid);
    shape-rendering: crispEdges;
  }
  .axis text { fill: var(--muted); font-size: 11px; }
  .axis-month text { fill: var(--text); font-size: 12px; font-weight: 600; }
  .gridline { stroke: var(--grid); stroke-dasharray: 2 3; }
  .month-divider { stroke: var(--grid-strong); }
  .today-line { stroke: var(--today); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .today-label { fill: var(--today); font-size: 11px; font-weight: 600; }
  .hover-line { stroke: #cbd2e0; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .hover-dot { fill: #cbd2e0; opacity: 0; pointer-events: none; }
  .bar-tick { stroke: rgba(255,255,255,0.35); stroke-width: 1; pointer-events: none; }
  .bar-tick-major { stroke: rgba(255,255,255,0.7); stroke-width: 1.25; pointer-events: none; }
  .bar-tick-label { fill: rgba(255,255,255,0.85); font-size: 10px; font-weight: 600; pointer-events: none; text-anchor: middle; }
  .bar-endpoint-label { fill: rgba(255,255,255,0.95); font-size: 10px; font-weight: 700; pointer-events: none; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(20, 24, 34, 0.97);
    border: 1px solid #2a3145;
    color: var(--text);
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.45;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    opacity: 0;
    transition: opacity 120ms ease;
    max-width: 280px;
    z-index: 10;
  }
  .tooltip .tt-title { font-weight: 700; margin-bottom: 4px; font-size: 13px; }
  .tooltip .tt-meta { color: var(--muted); }
  .tooltip .tt-detail { margin-top: 6px; color: #cbd2e0; }
  .tooltip .tt-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid #2a3145; }
  .tooltip .tt-section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .tooltip .tt-coll { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .tt-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .tooltip .tt-none { color: var(--muted); font-style: italic; }
  .tooltip .tt-cursor-date { font-weight: 700; color: #fff; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Work, School &amp; Graduation Timeline</h1>
        <div class="subtitle">June 1, 2026 → August 31, 2027</div>
      </div>
      <div class="header-right">
        <a class="nav-btn" href="course-plan.html">📋 Open Course Planner →</a>
        <div class="legend">
          <span><span class="swatch" style="background: #e53238;"></span>eBay</span>
          <span><span class="swatch" style="background: #0f62fe;"></span>IBM</span>
          <span><span class="swatch" style="background: #dac35c;"></span>UC Merced</span>
          <span><span class="swatch" style="background: #b388ff;"></span>Graduation</span>
        </div>
      </div>
    </header>
    <div class="chart-wrap">
      <svg id="chart" role="img" aria-label="Gantt timeline of work and school commitments"></svg>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

<script>
// Brand colors:
//   eBay red: #e53238
//   IBM blue: #0f62fe
//   UC Merced gold: #dac35c
//   Milestone (graduation): purple
const EBAY = { fill: "#e53238", edge: "#b8242a", text: "#ffffff" };
const IBM  = { fill: "#0f62fe", edge: "#0043ce", text: "#ffffff" };
const UCM  = { fill: "#dac35c", edge: "#b8a043", text: "#1a1a1a" };
const MILE = { fill: "#b388ff", edge: "#8e5ce6", text: "#ffffff" };

const data = [
  {
    name: "eBay PM Co-op",
    type: "Work",
    color: EBAY,
    start: "2026-06-15",
    end:   "2026-12-11",
    detail: ""
  },
  {
    name: "IBM Developer Co-op",
    type: "Work",
    color: IBM,
    start: "2026-08-31",
    end:   "2026-12-18",
    detail: "Hybrid in San Jose"
  },
  {
    name: "Summer Class",
    type: "School",
    color: UCM,
    start: "2026-06-22",
    end:   "2026-08-14",
    detail: "Mon–Fri, 1:30 PM – 3:20 PM"
  },
  {
    name: "Fall Semester",
    type: "School",
    color: UCM,
    start: "2026-08-26",
    end:   "2026-12-18",
    detail: ""
  },
  {
    name: "Spring Semester",
    type: "School",
    color: UCM,
    start: "2027-01-19",
    end:   "2027-05-14",
    detail: "UC Merced Spring 2027 — instruction Jan 19, finals end May 14"
  },
  {
    name: "Summer Session 2027",
    type: "School",
    color: UCM,
    start: "2027-06-21",
    end:   "2027-08-13",
    detail: "Session B (8-week) — final classes after walking. Degree confers at end of summer."
  },
  {
    name: "Spring Commencement App Deadline",
    type: "Milestone",
    color: MILE,
    start: "2027-03-01",
    end:   "2027-03-01",
    detail: "File Graduation Application by Mar 1 to walk in May as a Summer 2027 candidate"
  },
  {
    name: "Spring Commencement Ceremony",
    type: "Milestone",
    color: MILE,
    start: "2027-05-15",
    end:   "2027-05-15",
    detail: "Tentative — UC Merced typically holds the ceremony in mid-May. Summer & Spring 2027 candidates may walk."
  }
];

const parseDate = d3.timeParse("%Y-%m-%d");
data.forEach(d => {
  d.startDate = parseDate(d.start);
  d.endDate = parseDate(d.end);
});

const rangeStart = new Date(2026, 5, 1);   // Jun 1, 2026
const rangeEnd   = new Date(2027, 7, 31);  // Aug 31, 2027

const margin = { top: 24, right: 32, bottom: 72, left: 220 };
const rowHeight = 56;
const rowGap = 14;
const chartHeight = data.length * (rowHeight + rowGap) - rowGap;
const totalHeight = chartHeight + margin.top + margin.bottom;

const svg = d3.select("#chart")
  .attr("viewBox", `0 0 1160 ${totalHeight}`)
  .attr("preserveAspectRatio", "xMidYMid meet");

function render() {
  svg.selectAll("*").remove();

  const containerWidth = document.querySelector(".chart-wrap").clientWidth - 16;
  const width = Math.max(containerWidth, 1500);
  svg.attr("viewBox", `0 0 ${width} ${totalHeight}`);

  const x = d3.scaleTime()
    .domain([rangeStart, rangeEnd])
    .range([margin.left, width - margin.right]);

  const y = d3.scaleBand()
    .domain(data.map(d => d.name))
    .range([margin.top, margin.top + chartHeight])
    .paddingInner(rowGap / (rowHeight + rowGap));

  // Month dividers + half-month gridlines
  const months = d3.timeMonth.range(rangeStart, d3.timeMonth.offset(rangeEnd, 1));
  const halfMonths = [];
  months.forEach(m => {
    halfMonths.push(m);
    const mid = new Date(m.getFullYear(), m.getMonth(), 15);
    if (mid >= rangeStart && mid <= rangeEnd) halfMonths.push(mid);
  });

  svg.append("g")
    .selectAll("line.gridline")
    .data(halfMonths)
    .join("line")
    .attr("class", "gridline")
    .attr("x1", d => x(d))
    .attr("x2", d => x(d))
    .attr("y1", margin.top - 8)
    .attr("y2", margin.top + chartHeight + 8);

  svg.append("g")
    .selectAll("line.month-divider")
    .data(months)
    .join("line")
    .attr("class", "month-divider")
    .attr("x1", d => x(d))
    .attr("x2", d => x(d))
    .attr("y1", margin.top - 8)
    .attr("y2", margin.top + chartHeight + 8);

  // Row labels (left)
  const rows = svg.append("g").attr("class", "rows");
  data.forEach(d => {
    const yc = y(d.name) + y.bandwidth() / 2;
    rows.append("text")
      .attr("class", "row-label")
      .attr("x", 16)
      .attr("y", yc - 7)
      .text(d.name);
    rows.append("text")
      .attr("class", "row-sub")
      .attr("x", 16)
      .attr("y", yc + 9)
      .text(`${d3.timeFormat("%b %d")(d.startDate)} – ${d3.timeFormat("%b %d")(d.endDate)}`);
  });

  // Bars
  const tooltip = d3.select("#tooltip");
  const fmtFull = d3.timeFormat("%a, %b %d, %Y");

  // Hover cursor line (shared, drawn above bars)
  const hoverLine = svg.append("line")
    .attr("class", "hover-line")
    .attr("y1", margin.top - 8)
    .attr("y2", margin.top + chartHeight + 8);

  const colorFor = item => item.color.fill;

  const bars = svg.append("g").attr("class", "bars");
  data.forEach(d => {
    const isMilestone = d.type === "Milestone";
    const x0 = x(d.startDate);
    const x1 = x(d.endDate);
    const w = Math.max(2, x1 - x0);
    const yPos = y(d.name);
    const h = y.bandwidth();
    const fill = d.color.fill;
    const stroke = d.color.edge;
    const labelColor = d.color.text;

    const g = bars.append("g");

    // For milestones (single-day) draw a diamond pin centered on the date.
    // For ranges draw a rounded bar as before.
    const shape = isMilestone
      ? g.append("path")
          .attr("d", (() => {
            const cx = x0, cy = yPos + h / 2, r = Math.min(h / 2 - 4, 18);
            return `M ${cx} ${cy - r} L ${cx + r} ${cy} L ${cx} ${cy + r} L ${cx - r} ${cy} Z`;
          })())
          .attr("fill", fill)
          .attr("stroke", stroke)
          .attr("stroke-width", 1.5)
          .style("cursor", "pointer")
      : g.append("rect")
          .attr("class", "bar")
          .attr("x", x0)
          .attr("y", yPos)
          .attr("width", w)
          .attr("height", h)
          .attr("rx", 6).attr("ry", 6)
          .attr("fill", fill)
          .attr("stroke", stroke)
          .attr("stroke-width", 1);

    shape
      .on("mousemove", (event) => {
        // Map cursor x → date, snapped to nearest day, clamped to bar range
        const [mx] = d3.pointer(event, svg.node());
        let hoverDate = x.invert(mx);
        hoverDate = d3.timeDay.round(hoverDate);
        if (hoverDate < d.startDate) hoverDate = d.startDate;
        if (hoverDate > d.endDate) hoverDate = d.endDate;

        // Move cursor line to snapped date
        hoverLine
          .attr("x1", x(hoverDate))
          .attr("x2", x(hoverDate))
          .style("opacity", 1);

        // Collisions: other items active on hoverDate
        const collisions = data.filter(o =>
          o.name !== d.name &&
          hoverDate >= o.startDate &&
          hoverDate <= o.endDate
        );

        const days = Math.round((d.endDate - d.startDate) / 86400000) + 1;
        const weeks = Math.round(days / 7);
        const dayIntoBar = Math.round((hoverDate - d.startDate) / 86400000) + 1;

        const collisionsHtml = collisions.length
          ? collisions.map(c => `
              <div class="tt-coll">
                <span class="tt-dot" style="background:${colorFor(c)}"></span>
                <span>${c.name}${c.detail ? ` — <span class="tt-meta">${c.detail}</span>` : ""}</span>
              </div>`).join("")
          : `<div class="tt-none">Nothing else active</div>`;

        const headerLine = isMilestone
          ? `<div class="tt-meta">${d.type} • single date</div>
             <div class="tt-meta">${fmtFull(d.startDate)}</div>`
          : `<div class="tt-meta">${d.type} • ${weeks} wks (${days} days total)</div>
             <div class="tt-meta">Runs ${fmtFull(d.startDate)} → ${fmtFull(d.endDate)}</div>`;

        const cursorSection = isMilestone
          ? `<div class="tt-section">
               <div class="tt-section-title">Also active this day</div>
               ${collisionsHtml}
             </div>`
          : `<div class="tt-section">
               <div class="tt-cursor-date">${fmtFull(hoverDate)}</div>
               <div class="tt-meta">Day ${dayIntoBar} of ${days}</div>
               <div class="tt-section-title" style="margin-top:6px;">Also active this day</div>
               ${collisionsHtml}
             </div>`;

        const html = `
          <div class="tt-title">${d.name}</div>
          ${headerLine}
          ${d.detail ? `<div class="tt-detail">${d.detail}</div>` : ""}
          ${cursorSection}
        `;
        tooltip.html(html)
          .style("left", (event.pageX + 14) + "px")
          .style("top", (event.pageY + 14) + "px")
          .style("opacity", 1);
      })
      .on("mouseleave", () => {
        tooltip.style("opacity", 0);
        hoverLine.style("opacity", 0);
      });

    if (isMilestone) {
      // Floating date label next to the diamond
      const r = Math.min(h / 2 - 4, 18);
      g.append("text")
        .attr("class", "bar-endpoint-label")
        .attr("x", x0 + r + 8)
        .attr("y", yPos + h / 2 + 4)
        .attr("fill", "var(--text)")
        .text(d3.timeFormat("%b %-d, %Y")(d.startDate));
    } else {
      // Measure marks inside the bar:
      //  - minor tick every 7 days (week boundary, Monday)
      //  - major tick on the 1st of each month (with month abbrev label)
      //  - start/end date labels at the bar edges
      const tickGroup = g.append("g").attr("pointer-events", "none");

      // Weekly minor ticks (snap to next Monday inside the bar)
      const firstMonday = d3.timeMonday.ceil(d.startDate);
      const weeklyTicks = d3.timeMonday.range(firstMonday, d.endDate);
      weeklyTicks.forEach(t => {
        const tx = x(t);
        if (tx <= x0 + 2 || tx >= x0 + w - 2) return;
        tickGroup.append("line")
          .attr("class", "bar-tick")
          .attr("x1", tx).attr("x2", tx)
          .attr("y1", yPos + h - 8).attr("y2", yPos + h - 2);
      });

      // Tick color depends on bar text color (so ticks/labels stay readable on gold)
      const isDarkText = labelColor === "#1a1a1a";
      const tickMinorColor = isDarkText ? "rgba(0,0,0,0.35)" : "rgba(255,255,255,0.35)";
      const tickMajorColor = isDarkText ? "rgba(0,0,0,0.65)" : "rgba(255,255,255,0.7)";

      // Major month ticks (1st of each month inside the bar)
      const firstMonth = d3.timeMonth.ceil(d.startDate);
      const monthTicks = d3.timeMonth.range(firstMonth, d.endDate);
      monthTicks.forEach(t => {
        const tx = x(t);
        if (tx <= x0 + 14 || tx >= x0 + w - 14) return;
        tickGroup.append("line")
          .attr("class", "bar-tick-major")
          .attr("stroke", tickMajorColor)
          .attr("x1", tx).attr("x2", tx)
          .attr("y1", yPos + 2).attr("y2", yPos + h - 2);
        tickGroup.append("text")
          .attr("class", "bar-tick-label")
          .attr("fill", labelColor)
          .attr("x", tx)
          .attr("y", yPos + h - 4)
          .text(d3.timeFormat("%b 1")(t));
      });

      // Recolor weekly minor ticks (added above) for this bar
      tickGroup.selectAll("line.bar-tick").attr("stroke", tickMinorColor);

      // Start/end date labels inside the bar edges (if room)
      const fmtShort = d3.timeFormat("%b %-d");
      if (w > 70) {
        tickGroup.append("text")
          .attr("class", "bar-endpoint-label")
          .attr("fill", labelColor)
          .attr("x", x0 + 6)
          .attr("y", yPos + 12)
          .text(fmtShort(d.startDate));
        tickGroup.append("text")
          .attr("class", "bar-endpoint-label")
          .attr("fill", labelColor)
          .attr("x", x0 + w - 6)
          .attr("y", yPos + 12)
          .attr("text-anchor", "end")
          .text(fmtShort(d.endDate));
      }

      // In-bar label if it fits; otherwise float it just above the bar so it's never missing
      const label = d.name;
      const approxLabelWidth = label.length * 7.2 + 16;
      if (w > approxLabelWidth) {
        g.append("text")
          .attr("class", "bar-label")
          .attr("fill", labelColor)
          .attr("x", x0 + 10)
          .attr("y", yPos + h / 2 + 2)
          .text(label);
      } else {
        g.append("text")
          .attr("class", "bar-label")
          .attr("fill", "var(--text)")
          .attr("x", x0 + w / 2)
          .attr("y", yPos - 6)
          .attr("text-anchor", "middle")
          .text(label);
      }
    }
  });

  // Raise the hover line above the bars so it reads cleanly over tick marks
  hoverLine.raise();

  // Bottom axis: month ticks + half-month minor ticks
  const axisGroup = svg.append("g")
    .attr("class", "axis")
    .attr("transform", `translate(0, ${margin.top + chartHeight + 8})`);

  // Minor ticks (every ~15 days)
  const minorAxis = d3.axisBottom(x)
    .tickValues(halfMonths)
    .tickFormat(d => {
      const day = d.getDate();
      if (day === 1) return ""; // month label handled separately
      return d3.timeFormat("%b %d")(d);
    })
    .tickSize(6);
  axisGroup.call(minorAxis);
  axisGroup.selectAll(".domain").attr("stroke", "var(--grid-strong)");

  // Major month labels below
  const monthAxis = svg.append("g")
    .attr("class", "axis axis-month")
    .attr("transform", `translate(0, ${margin.top + chartHeight + 44})`);
  monthAxis.selectAll("text")
    .data(months)
    .join("text")
    .attr("x", d => {
      const next = d3.timeMonth.offset(d, 1);
      const mid = new Date((Math.max(+d, +rangeStart) + Math.min(+next, +rangeEnd)) / 2);
      return x(mid);
    })
    .attr("text-anchor", "middle")
    // Use short month; show year only in January or on the very first month shown
    .text((d, i) => {
      const showYear = d.getMonth() === 0 || i === 0;
      return showYear ? d3.timeFormat("%b %Y")(d) : d3.timeFormat("%b")(d);
    });

  // Today line (if within range)
  const today = new Date();
  if (today >= rangeStart && today <= rangeEnd) {
    svg.append("line")
      .attr("class", "today-line")
      .attr("x1", x(today))
      .attr("x2", x(today))
      .attr("y1", margin.top - 8)
      .attr("y2", margin.top + chartHeight + 8);
    svg.append("text")
      .attr("class", "today-label")
      .attr("x", x(today) + 6)
      .attr("y", margin.top - 12)
      .text("Today");
  }
}

render();
window.addEventListener("resize", render);
</script>
</body>
</html>
